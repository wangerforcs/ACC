env_task: libero_object
use_adaptive_chunk: true
enable_gripper_interruption: false
enable_object_motion_penalty: false
adaptive_min_horizon: 5
adaptive_max_horizon: 30
adaptive_uncertainty_threshold: 0.015
adaptive_coverage_threshold: 0.1
adaptive_continuity_threshold: 0.2
adaptive_chunker_cls_path: "adaptive.adaptivepolicyfinegrained_tracker_scoregate:AdaptiveActionChunker"
target_control_hz: 30.0
eval_batch_size: 1
max_episodes: 1
seed: 1000
adaptive_chunker:
  policy_type: finegrained_tracker_scoregate
  min_horizon: 5
  max_horizon: 30
  uncertainty_threshold: 0.015
  coverage_threshold: 0.1
  continuity_threshold: 0.2
  action_history_window: 5
  chunk_levels: 5
  grid_size:
    - 16
    - 16
  image_size:
    - 224
    - 224
  grounding_dino:
    config_path: /pub/data/wangzb/GroundingDINO/groundingdino/config/GroundingDINO_SwinB_cfg.py
    checkpoint_path: /pub/data/wangzb/GroundingDINO/weights/20260318_train2-3_best.pth
    device: cuda
  tracker_backend: csrt
  dino_refresh_interval: 200
  dino_accept_iou: 0.1
  dino_accept_center_dist: 0.15
  enable_object_motion_penalty: false
  object_motion_threshold: 0.01
  object_motion_lookback: 3
  object_motion_exit_threshold: 0.006
  object_motion_enter_persistence: 1
  object_motion_exit_persistence: 5
  gripper_box_half_size_px: 18
  gripper_contact_iou_threshold: 0.02
  gripper_contact_center_dist_threshold: 0.08
  gripper_contact_persistence: 2
  gripper_closed_threshold: -0.039
  dino_score_margin: 0.1
