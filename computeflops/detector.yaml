policy_name: pi05
env_task: libero_object
n_envs: 1
max_steps: 100
policy_path: /data/datasets/models-hf/pi05_libero_finetuned
output_dir: spike_test_results

train_cfg:
  policy:
    type: pi05
    pretrained_path: /data/datasets/models-hf/pi05_base
    device: cuda
    push_to_hub: false
    state_cond: false #why false in official libero setup
  dataset:
    repo_id: lerobot/libero
    video_backend: torchcodec
    use_imagenet_stats: true
  wandb:
    enable: true
    disable_artifact: true
    project: vlash
  num_workers: 16
  batch_size: 16
  steps: 60000
  seed: 42
  output_dir: outputs/train/pi05_async_libero
  job_name: pi05_async_libero_newtry
  use_policy_training_preset: false
  optimizer:
    type: adamw
    lr: 5.0e-5
    betas: [0.9, 0.95]
    weight_decay: 1.0e-10
    grad_clip_norm: 1.0
  scheduler:
    type: cosine_decay_with_warmup
    num_warmup_steps: 1000
    num_decay_steps: 50000
    peak_lr: 5.0e-5
    decay_lr: 5.0e-6
  save_checkpoint: true
  save_freq: 10000
  log_freq: 200
  max_delay_steps: 8
  shared_observation: true #why false in official
