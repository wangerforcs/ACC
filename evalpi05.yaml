# 环境配置
env_type: libero
env_task: libero_object
max_episodes: 50
eval_batch_size: 1
use_monitor: false

# 策略配置 (对应 load_policy_manual 中的字段)
policy:
  # type: pi05           # 对应 get_policy_class 为什么这个注释了也是pi05 哦因为policy被解析出来了, 加载模型的并用这里的覆盖
  path: /pub/data/wangzb/pi05_libero_finetuned
  # n_action_steps: 20   # 每次推理生成的动作步数
  n_action_steps: 30   # 每次推理生成的动作步数
  dtype: bfloat16
  device: cuda
  compile_model: false
  state_cond: false
  # fuse_qkv: true
  # fuse_gate_up: true

# VLASH 推理策略
inference_overlap_steps: 0
action_quant_ratio: 1 #1就是 不量化吧
# single_task: "open the middle drawer of the cabinet"

# 路径
seed: 1000
output_dir: outputs/eval/vlash_libero_benchmark

train_cfg:
  policy:
    type: pi05
    pretrained_path: /data/datasets/models-hf/pi05_base
    device: cuda
    push_to_hub: false
    state_cond: true #why false in official libero setup #之前这里都是true, 到底按照的哪个来的
  dataset:
    repo_id: lerobot/libero
    video_backend: torchcodec
    use_imagenet_stats: true
  wandb:
    enable: true
    disable_artifact: true
    project: vlash
  num_workers: 16
  batch_size: 16
  steps: 60000
  seed: 42
  output_dir: outputs/train/pi05_async_libero
  job_name: pi05_async_libero_newtry
  use_policy_training_preset: false
  optimizer:
    type: adamw
    lr: 5.0e-5
    betas: [0.9, 0.95]
    weight_decay: 1.0e-10
    grad_clip_norm: 1.0
  scheduler:
    type: cosine_decay_with_warmup
    num_warmup_steps: 1000
    num_decay_steps: 50000
    peak_lr: 5.0e-5
    decay_lr: 5.0e-6
  save_checkpoint: true
  save_freq: 10000
  log_freq: 200
  max_delay_steps: 8
  shared_observation: true #why false in official
